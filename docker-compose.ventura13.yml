services:
  macos:
    image: sickcodes/docker-osx:latest
    container_name: docker-osx-ventura13
    privileged: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    cpus: 7
    mem_limit: 7g
    memswap_limit: 8g
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "127.0.0.1:5900:5999"
      - "0.0.0.0:50922:10022"
    environment:
      SHORTNAME: ventura
      GENERATE_UNIQUE: "true"
      MASTER_PLIST_URL: https://raw.githubusercontent.com/sickcodes/osx-serial-generator/master/config-custom.plist
      RAM: "7"
      SMP: "7"
      CORES: "7"
      HTTP_PROXY: http://192.168.31.233:7890
      HTTPS_PROXY: http://192.168.31.233:7890
      NO_PROXY: localhost,127.0.0.1,::1,192.168.31.0/24,172.17.0.0/16
      EXTRA: -display none -vnc 0.0.0.0:99
    volumes:
      - ./data/mac_hdd_ng.img:/home/arch/OSX-KVM/mac_hdd_ng.img
      - ./data/BaseSystem.img:/home/arch/OSX-KVM/BaseSystem.img
